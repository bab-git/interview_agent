services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c"]
    command: >
      sleep 5 &&
      OLLAMA_HOST=http://ollama:11434 ollama pull llama3.2:1b
    restart: "no"

  app:
    build: .
    depends_on:
      ollama:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    environment:
      APP_DATA_DIR: /app/data
      APP_DB_PATH: /app/data/interview_agent.sqlite3
      PROMPT_ACTIVE_FILE: /app/data/active_prompt.json
      PROMPT_VERSIONS_DIR: /app/prompts/versions
      LLM_BACKEND: ollama
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: llama3.2:1b
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./prompts:/app/prompts

volumes:
  ollama_data:
