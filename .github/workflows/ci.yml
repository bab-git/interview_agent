name: CI/CD

on:
  push:
    branches:
      - main
      - develop
      - feature/**
      - codex/**
  pull_request:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Test and validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt

      - name: Run tests
        run: |
          . .venv/bin/activate
          pytest

      - name: Build container image
        run: docker build -t production-interview-agent:test .

  publish_image:
    name: Publish container image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.image_ref.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: tags
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${GITHUB_SHA}"
            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              echo "${IMAGE_NAME}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Record immutable image reference
        id: image_ref
        run: echo "image_ref=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  deploy:
    name: Deploy to Docker host
    runs-on: ubuntu-latest
    needs: publish_image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_CD == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create remote deploy directory
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          envs: DEPLOY_PATH
          script: |
            set -eu
            DEPLOY_PATH="${DEPLOY_PATH:-/opt/production-interview-agent}"
            mkdir -p "$DEPLOY_PATH"

      - name: Copy deployment compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy/docker-compose.production.yml
          target: ${{ vars.DEPLOY_PATH || '/opt/production-interview-agent' }}
          strip_components: 1

      - name: Pull and restart services
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_REF: ${{ needs.publish_image.outputs.image_ref }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          APP_PORT: ${{ vars.APP_PORT }}
          LLM_BACKEND: ${{ vars.LLM_BACKEND }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}
          REQUEST_TIMEOUT_SECONDS: ${{ vars.REQUEST_TIMEOUT_SECONDS }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          envs: IMAGE_REF,DEPLOY_PATH,APP_PORT,LLM_BACKEND,OLLAMA_MODEL,REQUEST_TIMEOUT_SECONDS,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -eu

            DEPLOY_PATH="${DEPLOY_PATH:-/opt/production-interview-agent}"
            APP_PORT="${APP_PORT:-8000}"
            LLM_BACKEND="${LLM_BACKEND:-ollama}"
            OLLAMA_MODEL="${OLLAMA_MODEL:-llama3.2:1b}"
            REQUEST_TIMEOUT_SECONDS="${REQUEST_TIMEOUT_SECONDS:-30}"

            cat > "$DEPLOY_PATH/.env.production" <<EOF
            IMAGE_NAME=$IMAGE_REF
            APP_PORT=$APP_PORT
            LLM_BACKEND=$LLM_BACKEND
            OLLAMA_MODEL=$OLLAMA_MODEL
            REQUEST_TIMEOUT_SECONDS=$REQUEST_TIMEOUT_SECONDS
            EOF

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            docker compose \
              --env-file "$DEPLOY_PATH/.env.production" \
              -f "$DEPLOY_PATH/docker-compose.production.yml" \
              pull

            docker compose \
              --env-file "$DEPLOY_PATH/.env.production" \
              -f "$DEPLOY_PATH/docker-compose.production.yml" \
              up -d

            for attempt in $(seq 1 24); do
              if curl -fsS "http://127.0.0.1:${APP_PORT}/health" >/dev/null; then
                exit 0
              fi
              sleep 5
            done

            docker compose \
              --env-file "$DEPLOY_PATH/.env.production" \
              -f "$DEPLOY_PATH/docker-compose.production.yml" \
              logs --no-color app

            exit 1
